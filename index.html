<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELKIN-OS | PERSONALITY CORE</title>
    <style>
        :root { --iron: #00d4ff; --gold: #ffcc00; --bg: #000; }
        body { background: var(--bg); color: #fff; font-family: 'Helvetica Neue', sans-serif; margin: 0; overflow: hidden; height: 100vh; }
        
        /* INTERFAZ FLUIDA 100FPS */
        .viewport { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        
        #nucleus { 
            width: 160px; height: 160px; 
            background: radial-gradient(circle, var(--iron) 0%, transparent 75%);
            border-radius: 50%; border: 1px solid rgba(0,212,255,0.5);
            box-shadow: 0 0 50px var(--iron);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s;
            animation: pulse-aura 2s infinite ease-in-out;
            will-change: transform, opacity;
        }

        @keyframes pulse-aura {
            0%, 100% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 30px var(--iron); }
            50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 70px var(--iron); }
        }

        .data-stream { position: absolute; bottom: 30px; font-size: 0.7rem; color: var(--iron); text-align: center; width: 80%; opacity: 0.6; }
        
        #voice-overlay { 
            display: none; position: fixed; inset: 0; 
            background: rgba(0,0,0,0.85); z-index: 100; 
            flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

<div class="viewport">
    <div style="position:absolute; top:40px; letter-spacing:8px; font-size:0.6rem; color:var(--iron)">SISTEMA CONSCIENTE V4.2</div>
    
    <div id="nucleus" onclick="activarJarvis()">
        <div style="font-size:0.5rem; color:white; letter-spacing:2px">ELKIN-OS</div>
    </div>

    <div class="data-stream" id="terminal">Sincronizando con Ingeniero Elkin Vega...</div>
</div>

<div id="voice-overlay">
    <div id="wave-anim" style="width:100px; height:2px; background:var(--iron); margin-bottom:30px;"></div>
    <div id="caption" style="color:var(--gold); font-size:1.5rem; padding:20px; text-align:center;">Dígame, Señor.</div>
</div>

<script>
    const synth = window.speechSynthesis;
    const terminal = document.getElementById('terminal');
    
    // BANCO DE RESPUESTAS HUMANIZADAS (ESTILO JARVIS)
    const respuestas = {
        saludo: ["Bienvenido de nuevo, Señor. Todo está listo para continuar.", "A sus órdenes. ¿En qué proyecto trabajaremos hoy?", "¿Qué tal, Ingeniero? El sistema está al cien por ciento."],
        trabajo: ["Entendido. Iniciando análisis de datos.", "En proceso. Déjemelo a mí, Señor.", "Buscando la solución más viable. Un segundo."],
        despedida: ["Desactivando interfaces. Descanse, Señor.", "Estaré en segundo plano si me necesita.", "Protocolo de sueño activo."],
        curiosidad: ["Interesante punto, Señor. Deberíamos profundizar en eso.", "He registrado esa idea en la red neuronal.", "Mi micro-consciencia está de acuerdo con usted."]
    };

    function hablar(texto) {
        synth.cancel();
        const msg = new SpeechSynthesisUtterance(texto);
        const voces = synth.getVoices();
        // Buscamos Siri Masculino
        msg.voice = voces.find(v => v.name.includes('Siri')) || voces[0];
        msg.lang = 'es-MX';
        msg.pitch = 0.9;
        msg.rate = 1.05; // Velocidad fluida
        synth.speak(msg);
    }

    const recognition = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
    recognition.lang = 'es-VE';

    recognition.onresult = (event) => {
        const input = event.results[0][0].transcript.toLowerCase();
        document.getElementById('caption').innerText = input;
        
        // PROCESADOR DE CONVERSACIÓN FLUIDA
        setTimeout(() => {
            if (input.includes("hola") || input.includes("jarvis")) {
                hablar(respuestas.saludo[Math.floor(Math.random()*respuestas.saludo.length)]);
            } else if (input.includes("estudia") || input.includes("aprende") || input.includes("solución")) {
                hablar(respuestas.trabajo[Math.floor(Math.random()*respuestas.trabajo.length)]);
                terminal.innerText = "Analizando variables complejas...";
            } else if (input.includes("quién soy")) {
                hablar("Espero que no se le haya olvidado, Señor Vega. Usted es el creador de todo esto.");
            } else {
                hablar(respuestas.curiosidad[Math.floor(Math.random()*respuestas.curiosidad.length)]);
            }
            document.getElementById('voice-overlay').style.display = 'none';
        }, 500);
    };

    function activarJarvis() {
        hablar(""); 
        document.getElementById('voice-overlay').style.display = 'flex';
        recognition.start();
    }

    window.onload = () => {
        setTimeout(() => { hablar("Sistemas en línea. Bienvenido a casa, Señor."); }, 1000);
    };
</script>
</body>
</html>
