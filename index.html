<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELKIN-OS V5.0 | NLU</title>
    <style>
        :root { --cian: #00d4ff; --oro: #ffd700; --bg: #010c12; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .header { border-bottom: 1px solid var(--cian); padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; }
        .title { color: var(--cian); font-weight: bold; letter-spacing: 2px; font-size: 18px; }
        .terminal { background: rgba(0, 212, 255, 0.05); border: 1px solid var(--cian); border-radius: 10px; padding: 15px; font-family: monospace; min-height: 100px; box-shadow: inset 0 0 10px rgba(0, 212, 255, 0.2); }
        .btn-core { width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--cian); margin: 20px auto; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px var(--cian); cursor: pointer; transition: 0.3s; }
        .btn-core:active { transform: scale(0.9); box-shadow: 0 0 40px var(--oro); border-color: var(--oro); }
    </style>
</head>
<body>

<div class="header">
    <div class="title">ELKIN-OS</div>
    <div style="font-size: 10px; text-align: right;">V5.0 OMEGA<br>ADMIN: ELKIN VEGA</div>
</div>

<div class="btn-core" onclick="iniciarEscucha()">
    <span id="status-text" style="font-size: 10px; color: var(--cian);">LISTO</span>
</div>

<div class="terminal" id="terminal">
    > SISTEMA NOMINAL...<br>
    > TOQUE EL NÚCLEO PARA HABLAR.
</div>

<script>
    // --- MOTOR DE COMPRENSIÓN NATURAL (EL CEREBRO) ---
    const Brain = {
        intenciones: [
            {
                nombre: "ACADEMICO",
                keys: ["estudio", "universidad", "tarea", "agro", "iut", "clase", "examen", "botánica", "plantas"],
                resp: "Accediendo a los archivos de Ingeniería Agropecuaria. ¿En qué tema trabajaremos, Elkin?"
            },
            {
                nombre: "NEGOCIO",
                keys: ["perro", "cliente", "peluquería", "grooming", "baño", "corte", "mascota"],
                resp: "Panel de control de la peluquería activo. Listado de clientes cargado."
            },
            {
                nombre: "SEGURIDAD",
                keys: ["hack", "intruso", "seguridad", "alerta", "bloqueo"],
                resp: "Protocolo de seguridad activado. Escaneando perímetros digitales."
            }
        ],

        procesar: function(frase) {
            const input = frase.toLowerCase();
            
            // Lógica de búsqueda (Investigación)
            if (input.includes("busca") || input.includes("investiga") || input.includes("qué es")) {
                let tema = input.replace(/busca|investiga|qué es/g, "").trim();
                window.open(`https://www.google.com/search?q=${tema}`, '_blank');
                return `Indagando en la red sobre ${tema}.`;
            }

            // Lógica de intenciones generales
            for (let i of this.intenciones) {
                if (i.keys.some(k => input.includes(k))) return i.resp;
            }

            return "Entendido, Elkin. Procesando tu solicitud en el núcleo central.";
        }
    };

    // --- SENSORES DE VOZ ---
    const rec = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
    rec.lang = 'es-VE';

    function hablar(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'es-MX';
        window.speechSynthesis.speak(m);
    }

    function iniciarEscucha() {
        rec.start();
        document.getElementById('status-text').innerHTML = "OYENDO";
        document.getElementById('status-text').style.color = "#00ffaa";
    }

    rec.onresult = (event) => {
        const voz = event.results[0][0].transcript;
        const respuesta = Brain.procesar(voz);
        
        document.getElementById('terminal').innerHTML = `> TU: ${voz}<br>> OS: ${respuesta}`;
        hablar(respuesta);
        document.getElementById('status-text').innerHTML = "LISTO";
        document.getElementById('status-text').style.color = "var(--cian)";
    };
</script>
</body>
</html>
