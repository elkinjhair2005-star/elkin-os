<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELKIN-OS OMEGA</title>
    <style>
        :root { --stark-gold: #ffcc00; --stark-inner: rgba(255, 204, 0, 0.2); }
        body { background: #000; color: #00d4ff; font-family: 'Helvetica', sans-serif; margin: 0; overflow: hidden; height: 100vh; }

        /* HUD SUPERIOR (Igual a tu imagen 6038) */
        .hud-top { position: absolute; top: 20px; width: 100%; padding: 0 20px; display: flex; justify-content: space-between; font-size: 0.6rem; letter-spacing: 2px; }
        
        /* EL NÚCLEO QUE SÍ SE VA A VER */
        .viewport { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        #nucleus-container {
            width: 250px; height: 250px;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }

        /* Esfera de datos Stark */
        .sphere {
            position: absolute;
            width: 100%; height: 100%;
            border: 2px solid var(--stark-gold);
            border-radius: 50%;
            box-shadow: 0 0 40px var(--stark-gold), inset 0 0 20px var(--stark-gold);
            animation: pulse 2s infinite ease-in-out;
        }

        .ring {
            position: absolute;
            width: 110%; height: 110%;
            border: 1px dashed var(--stark-gold);
            border-radius: 50%;
            animation: rotate 10s linear infinite;
            opacity: 0.5;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* TERMINAL INFERIOR (Igual a tu imagen 6039) */
        #diag-box {
            position: absolute; bottom: 30px; width: 90%; left: 5%;
            border: 1px solid #00d4ff; background: rgba(0,0,0,0.8);
            padding: 10px; font-size: 0.55rem; border-radius: 5px;
            color: #00d4ff; line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="hud-top">
    <div>SYSTEM: ELKIN-OS OMEGA V4.0<br>USER: ELKIN VEGA</div>
    <div style="text-align:right">STATUS: ALPHA-LEVEL<br>CORE: HOLOGRAPHIC</div>
</div>

<div class="viewport">
    <div id="nucleus-container" onclick="activarVoz()">
        <div class="sphere"></div>
        <div class="ring"></div>
        <div style="z-index:10; font-weight:bold; letter-spacing:5px; color:#fff; text-shadow:0 0 10px var(--stark-gold);">ELKIN-OS</div>
    </div>
</div>

<div id="diag-box">
    > PROCESADOR HOLOGRÁFICO 3D RE-INICIALIZADO.<br>
    > OPTIMIZACIÓN DE GPU PARA IPHONE... OK.<br>
    > <span style="color:var(--stark-gold)">MODO JARVIS ACTIVO. ESPERANDO ÓRDENES.</span>
</div>

<script>
    const synth = window.speechSynthesis;
    function hablar(txt) {
        synth.cancel();
        const m = new SpeechSynthesisUtterance(txt);
        m.lang = 'es-MX'; // Voz Siri Masculina
        m.pitch = 0.9;
        synth.speak(m);
    }

    function activarVoz() {
        hablar("Protocolo restablecido, Comandante Vega. El núcleo está operativo al cien por ciento.");
        document.querySelector('.sphere').style.borderColor = "#00ffaa";
    }

    window.onload = () => {
        setTimeout(() => { hablar("Sistemas en línea. Bienvenido de nuevo."); }, 500);
    };
</script>
</body>
</html>
