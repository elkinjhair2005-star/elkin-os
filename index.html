<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELKIN-OS | PROTOCOLO JARVIS</title>
    <style>
        :root { --neon: #00d4ff; --gold: #ffcc00; --bg: #000; }
        body { background: var(--bg); color: #fff; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; height: 100vh; }
        #viewport { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .hud { position: absolute; border: 1px solid var(--neon); background: rgba(0, 20, 30, 0.85); padding: 12px; border-radius: 8px; font-size: 0.7rem; box-shadow: 0 0 15px rgba(0,212,255,0.2); }
        #hud-univ { top: 5%; left: 5%; width: 150px; }
        #hud-eng { top: 5%; right: 5%; width: 150px; border-color: var(--gold); }
        #hud-sec { bottom: 20%; left: 5%; border-color: #00ffaa; }
        #spirit { width: 180px; height: 180px; background: radial-gradient(circle, var(--neon) 0%, transparent 70%); filter: blur(15px); border-radius: 50%; animation: pulse 4s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.3); opacity: 0.8; } }
        #comm-orb { position: absolute; bottom: 40px; width: 90px; height: 90px; background: radial-gradient(circle, #fff, var(--neon)); border-radius: 50%; box-shadow: 0 0 50px var(--neon); cursor: pointer; z-index: 1000; }
    </style>
</head>
<body>

<div id="viewport">
    <div class="hud" id="hud-univ">NIVEL ACADÉMICO<br>IUT: <b>Ing. Agropecuaria</b></div>
    <div class="hud" id="hud-eng">SISTEMA INTELIGENTE<br>Voz: <b>IA JARVIS</b></div>
    <div class="hud" id="hud-sec">🛡️ SEGURIDAD<br>USUARIO: <b style="color:#00ffaa">ELKIN VEGA</b></div>
    <div id="spirit"></div>
    <div id="comm-orb" onclick="activarYEscuchar()"></div>
</div>

<div id="eng-view" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:2000; text-align:center; padding-top:50px;">
    <h2 style="color:var(--gold); letter-spacing: 2px;">[ ESCUCHANDO, SEÑOR ]</h2>
    <div id="eng-output" style="color:#00ffaa; font-size:1.6rem; margin:40px; font-weight: bold;"></div>
    <button onclick="cerrarVistas()" style="background:none; border:1px solid #fff; color:#fff; padding:15px 30px; border-radius:30px; font-family: 'Courier New';">CANCELAR PROTOCOLO</button>
</div>

<script>
    const synth = window.speechSynthesis;
    let voces = [];

    // Cargar voces disponibles
    function cargarVoces() {
        voces = synth.getVoices();
    }
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = cargarVoces;
    }

    function hablar(texto) {
        synth.cancel();
        const mensaje = new SpeechSynthesisUtterance(texto);
        
        // Buscamos una voz que suene masculina y elegante (español o castellano)
        const vozJarvis = voces.find(v => v.name.includes('Jorge') || v.name.includes('Enrique') || v.lang === 'es-ES');
        if (vozJarvis) mensaje.voice = vozJarvis;

        mensaje.lang = 'es-ES'; 
        mensaje.pitch = 0.65; // Tono grave como en las películas
        mensaje.rate = 0.9;   // Pausado y elegante
        mensaje.volume = 1;
        
        synth.speak(mensaje);
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition ? new SpeechRecognition() : null;

    if (recognition) {
        recognition.lang = 'es-VE';
        recognition.onresult = (event) => {
            const voz = event.results[0][0].transcript.toLowerCase();
            document.getElementById('eng-output').innerHTML = '"' + voz + '"';
            procesarOrden(voz);
        };
    }

    function activarYEscuchar() {
        // Truco para iPhone: emitir un sonido mudo para habilitar la bocina
        hablar(""); 
        document.getElementById('eng-view').style.display = 'block';
        document.getElementById('eng-output').innerHTML = "Esperando órdenes...";
        if(recognition) recognition.start();
    }

    function procesarOrden(input) {
        if (input.includes("quién soy") || input.includes("quién eres")) {
            hablar("Usted es el Ingeniero Elkin Vega. Yo soy su sistema personal, configurado para asistirle, Señor.");
        } else if (input.includes("hola") || input.includes("jarvis")) {
            hablar("A sus órdenes, Señor. Todos los sistemas están operativos y listos para su inspección.");
        } else if (input.includes("estado")) {
            hablar("La integridad del sistema es estable. La base de datos de Ingeniería Agropecuaria está sincronizada, Señor.");
        } else {
            hablar("Señal recibida, Señor. Procesando datos sobre: " + input);
        }
    }

    function cerrarVistas() {
        document.getElementById('eng-view').style.display = 'none';
    }
</script>
</body>
</html>
