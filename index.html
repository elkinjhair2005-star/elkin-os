<script>
    // Úsalo dentro de tu etiqueta <script> actual
    const rec = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
    rec.lang = 'es-VE'; // Tu acento, Elkin
    rec.continuous = false;
    rec.interimResults = false;

    rec.onstart = () => {
        // Efecto visual de que JARVIS te está oyendo
        document.getElementById('nucleus-svg').style.filter = "drop-shadow(0 0 30px #00ffaa)";
        console.log("Escuchando...");
    };

    rec.onresult = (event) => {
        const comando = event.results[0][0].transcript.toLowerCase();
        document.querySelector('.terminal').innerHTML = "> COMANDO RECIBIDO: " + comando;
        
        if(comando.includes("hola") || comando.includes("elkin")) {
            hablar("A sus órdenes, Señor Vega. El sistema está totalmente operativo.");
        } else if(comando.includes("agro")) {
            hablar("Accediendo a los archivos de Ingeniería Agropecuaria del I.U.T.");
        } else {
            hablar("He procesado su solicitud, Comandante.");
        }
    };

    function hablarProtocolo() {
        hablar("Activando sensores de audio.");
        rec.start(); // Esto arranca el micrófono
    }
</script>
