<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELKIN-OS | OMEGA FINAL</title>
    <style>
        :root { --gold: #ffd700; --glow: rgba(255, 215, 0, 0.6); --interface: #00d4ff; }
        body { background: #000; color: #fff; font-family: 'Helvetica Neue', Arial; margin: 0; overflow: hidden; height: 100vh; }

        /* HUD SUPERIOR */
        #hud-header { position: absolute; top: 15px; width: 100%; padding: 0 20px; display: flex; justify-content: space-between; font-size: 0.6rem; letter-spacing: 2px; font-weight: bold; box-sizing: border-box; }
        .stark-txt { color: var(--gold); }

        /* EL NÚCLEO QUE SÍ SE VA A VER (VECTORIAL) */
        .main-container { height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; }
        
        #stark-core {
            width: 220px; height: 220px;
            position: relative;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* Capas de la Esfera */
        .sphere-layer {
            position: absolute; border-radius: 50%;
            border: 1px solid var(--gold);
            box-shadow: 0 0 30px var(--glow), inset 0 0 20px var(--glow);
            animation: pulse-stark 2s infinite ease-in-out;
        }
        .layer-1 { width: 100%; height: 100%; opacity: 0.8; }
        .layer-2 { 
            width: 110%; height: 110%; border: 1px dashed var(--gold); 
            opacity: 0.4; animation: rotate-core 15s linear infinite; 
        }

        /* El brillo interno */
        .inner-light {
            width: 60px; height: 60px;
            background: var(--gold);
            border-radius: 50%;
            filter: blur(25px);
            animation: flicker 0.1s infinite;
        }

        @keyframes pulse-stark {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.08); opacity: 1; }
        }
        @keyframes rotate-core { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes flicker { 0% { opacity: 0.8; } 100% { opacity: 1; } }

        /* TERMINAL DE DIAGNÓSTICO (ESTILO IMAGEN 6040) */
        #terminal-box {
            position: absolute; bottom: 40px; width: 90%; left: 5%;
            border: 1px solid var(--interface); background: rgba(0,20,30,0.8);
            padding: 15px; font-family: monospace; font-size: 0.6rem; border-radius: 4px;
            box-sizing: border-box; color: var(--interface);
        }
    </style>
</head>
<body>

<div id="hud-header">
    <div>SYSTEM: <span class="stark-txt">ELKIN-OS OMEGA V4.0</span><br>USER: <span style="color:#fff">ELKIN VEGA</span></div>
    <div style="text-align:right">STATUS: <span style="color:#00ffaa">NIVEL MÁXIMO</span><br>CORE: <span class="stark-txt">HOLOGRÁFICO ACTIVO</span></div>
</div>

<div class="main-container">
    <div id="stark-core" onclick="ejecutarVoz()">
        <div class="sphere-layer layer-1"></div>
        <div class="sphere-layer layer-2"></div>
        <div class="inner-light"></div>
        <div style="z-index:20; font-weight:bold; letter-spacing:4px; font-size:0.8rem; text-shadow: 0 0 10px #000;">ELKIN-OS</div>
    </div>
</div>

<div id="terminal-box">
    > INYECTANDO CÓDIGO DE RENDERIZADO VECTORIAL... <span style="color:#fff">HECHO</span><br>
    > SINCRONIZANDO NÚCLEO DORADO CON GPU... <span style="color:#fff">OK</span><br>
    > <span class="stark-txt">SISTEMA JARVIS LISTO PARA EL COMANDANTE VEGA.</span>
</div>

<script>
    const s = window.speechSynthesis;
    function hablar(t) {
        s.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'es-MX'; // Voz masculina fluida
        m.rate = 1.0; m.pitch = 0.85;
        s.speak(m);
    }

    function ejecutarVoz() {
        hablar("Sistemas operativos al cien por ciento. Dígame, Señor Vega, ¿qué indagaremos hoy?");
        document.querySelector('.inner-light').style.background = "#00ffaa";
    }

    window.onload = () => {
        setTimeout(() => { hablar("Sincronización completa. ELKIN-OS en línea."); }, 800);
    };
</script>
</body>
</html>
