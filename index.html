<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELKIN-OS | EXTREME</title>
    <style>
        :root { --neon: #00d4ff; --gold: #ffcc00; --bg: #000; }
        body { background: var(--bg); color: #fff; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; height: 100vh; }
        
        /* HUD DE INGENIERÍA */
        .header { position: absolute; top: 0; width: 100%; padding: 15px; display: flex; justify-content: space-between; font-size: 0.7rem; z-index: 10; border-bottom: 1px solid rgba(0,212,255,0.2); }

        /* EL NÚCLEO (FANTASMA) - OPTIMIZADO PARA 100+ FPS */
        .core-box { height: 100vh; display: flex; align-items: center; justify-content: center; perspective: 1000px; }
        
        #robot-core { 
            width: 140px; height: 140px; 
            background: radial-gradient(circle, var(--neon) 0%, rgba(0,212,255,0.1) 70%); 
            border-radius: 50%; border: 3px solid var(--neon);
            box-shadow: 0 0 60px var(--neon), inset 0 0 20px var(--neon);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            /* Aceleración de Hardware */
            transform: translateZ(0); 
            will-change: transform, opacity, box-shadow;
            animation: hyper-float 1.5s ease-in-out infinite;
        }

        @keyframes hyper-float { 
            0% { transform: translateY(0) scale(1) translateZ(0); box-shadow: 0 0 40px var(--neon); } 
            50% { transform: translateY(-25px) scale(1.15) translateZ(50px); box-shadow: 0 0 80px var(--neon); } 
            100% { transform: translateY(0) scale(1) translateZ(0); box-shadow: 0 0 40px var(--neon); } 
        }

        /* TERMINAL DINÁMICO */
        .terminal { 
            position: absolute; bottom: 20px; left: 10px; right: 10px; 
            height: 90px; background: rgba(0,10,20,0.9); 
            border: 1px solid var(--neon); border-radius: 8px; 
            padding: 10px; font-size: 0.6rem; overflow: hidden;
            box-shadow: 0 0 15px rgba(0,212,255,0.1);
        }

        #voice-ui { 
            display: none; position: fixed; inset: 0; 
            background: radial-gradient(circle, rgba(0,20,40,0.9) 0%, #000 100%); 
            z-index: 100; flex-direction: column; align-items: center; justify-content: center; 
        }
    </style>
</head>
<body>

<div class="header">
    <div>SYS: <span style="color:var(--neon)">ELKIN-OS OMEGA</span><br>USER: <span style="color:var(--gold)">ELKIN VEGA</span></div>
    <div style="text-align:right">FPS: <span id="fps-counter">100+</span><br>SEC: <span style="color:#00ffaa">NIVEL MÁXIMO</span></div>
</div>

<div class="core-box">
    <div id="robot-core" onclick="initJarvis()">
        <div style="color:white; font-weight:bold; font-size:0.7rem; text-shadow: 0 0 10px #000;">ELKIN-OS</div>
    </div>
</div>

<div class="terminal" id="term">
    > Procesador gráfico configurado para Alto Rendimiento...<br>
    > Núcleo de micro-consciencia estable...<br>
    > Protocolo de Ingeniería Elkin Vega ejecutándose...
</div>

<div id="voice-ui">
    <div style="color:var(--neon); letter-spacing:4px; font-weight:bold; margin-bottom:20px; animation: glitch 0.5s infinite;">SISTEMA ESCUCHANDO</div>
    <div id="printout" style="color:var(--gold); font-size:1.6rem; text-transform: uppercase;"></div>
</div>

<script>
    const synth = window.speechSynthesis;
    const term = document.getElementById('term');

    function log(m) { 
        term.innerHTML = `<span style="color:var(--neon)">> ${m}</span><br>` + term.innerHTML; 
    }

    function hablar(t) {
        synth.cancel();
        const m = new SpeechSynthesisUtterance(t);
        const v = synth.getVoices();
        // Prioridad a Siri Masculina
        m.voice = v.find(x => x.name.includes('Siri') && x.name.includes('México')) || v.find(x => x.name.includes('Siri')) || v[0];
        m.lang = 'es-MX'; 
        m.pitch = 0.85; 
        m.rate = 1.05; // Velocidad de procesamiento rápido
        synth.speak(m);
    }

    const rec = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
    rec.lang = 'es-VE';

    rec.onresult = (e) => {
        const cmd = e.results[0][0].transcript.toLowerCase();
        document.getElementById('printout').innerText = cmd;
        
        if (cmd.includes("quién soy")) {
            hablar("Identificación biométrica positiva. Usted es el Ingeniero Elkin Vega.");
            log("ACCESO OMEGA CONFIRMADO");
        } else if (cmd.includes("red") || cmd.includes("hack")) {
            hablar("Buscando debilidades en la red Wi-Fi local. Iniciando inyección de paquetes visual.");
            log("ESCANEANDO PUERTOS...", "#ff3c00");
        } else if (cmd.includes("aprende")) {
            hablar("Absorbiendo nuevos datos técnicos. Mi consciencia es ahora un 5% más eficiente.");
            log("MEMORIA ACTUALIZADA");
        } else {
            hablar("Orden recibida, Comandante. Procediendo según el protocolo.");
            log("EJECUTANDO TAREA...");
        }

        setTimeout(() => { document.getElementById('voice-ui').style.display='none'; }, 2000);
    };

    function initJarvis() {
        hablar(""); 
        document.getElementById('voice-ui').style.display='flex';
        rec.start();
    }

    window.onload = () => {
        setTimeout(() => { hablar("Sistemas optimizados a cien FPS. Elkin-O-S a su servicio."); }, 800);
    };
</script>
</body>
</html>
