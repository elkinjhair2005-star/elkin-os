<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELKIN-OS | OMEGA</title>
    <style>
        body { background: #000; color: #ffd700; font-family: 'Arial', sans-serif; margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .header { padding: 20px; display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 2px; }
        
        /* NÚCLEO DINÁMICO */
        .core-wrapper { flex-grow: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        .stark-sphere {
            width: 200px; height: 200px; border: 4px double #ffd700; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5); transition: 0.3s;
            animation: pulse 2s infinite ease-in-out;
        }
        .core-text { font-size: 14px; letter-spacing: 5px; font-weight: bold; color: #fff; text-shadow: 0 0 10px #ffd700; }

        /* TERMINAL DE IA */
        .footer-terminal { margin: 20px; padding: 15px; border: 1px solid #00d4ff; background: rgba(0, 20, 30, 0.8); border-radius: 5px; font-family: monospace; font-size: 10px; color: #00d4ff; min-height: 50px; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div>SYSTEM: ELKIN-OS<br>USER: ELKIN VEGA</div>
        <div>STATUS: ONLINE<br>MODE: AI-BRAIN</div>
    </div>

    <div class="core-wrapper" onclick="encenderSistema()">
        <div class="stark-sphere" id="sphere">
            <div class="core-text">ELKIN-OS</div>
        </div>
    </div>

    <div class="footer-terminal" id="terminal">
        > SISTEMA EN ESPERA.<br>
        > TOQUE EL NÚCLEO PARA INICIAR PROTOCOLO.
    </div>

<script>
    // --- MÓDULO CEREBRAL (LA INTELIGENCIA) ---
    const Brain = {
        procesar: function(input) {
            const frase = input.toLowerCase();
            if (this.match(frase, ["hola", "saludos", "despierta"])) 
                return "Protocolo de bienvenida activo. ¿Qué órdenes tiene, Elkin?";
            
            if (this.match(frase, ["agro", "estudio", "iut", "planta", "botánica"])) 
                return "Accediendo a módulos de Ingeniería Agropecuaria. El análisis morfológico está listo.";
            
            if (this.match(frase, ["perro", "peluquería", "canina", "cliente", "baño"])) 
                return "Panel de peluquería canina activo. ¿Desea revisar la agenda de servicios?";
            
            if (this.match(frase, ["quién soy", "nombre", "identidad"])) 
                return "Usted es Elkin, el comandante de este sistema operativo.";

            return "He registrado su mensaje, pero no tengo datos locales. ¿Indago en la red?";
        },
        match: (txt, keys) => keys.some(k => txt.includes(k))
    };

    // --- MÓDULO DE VOZ Y OÍDO ---
    const synth = window.speechSynthesis;
    const Recognition = window.webkitSpeechRecognition || window.SpeechRecognition;
    const rec = new Recognition();
    rec.lang = 'es-VE';
    rec.continuous = false;

    function hablar(t) {
        synth.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'es-MX'; m.rate = 1.0; m.pitch = 0.9;
        synth.speak(m);
    }

    // --- LÓGICA DE CONTROL ---
    function encenderSistema() {
        hablar("Iniciando sensores de audio. Elkin-OS le escucha.");
        document.getElementById('terminal').innerHTML = "> ESCUCHANDO...";
        document.getElementById('sphere').style.borderColor = "#00ffaa";
        rec.start();
    }

    rec.onresult = (event) => {
        const voz = event.results[0][0].transcript;
        const respuesta = Brain.procesar(voz);
        
        document.getElementById('terminal').innerHTML = `> USTED: ${voz}<br>> IA: ${respuesta}`;
        hablar(respuesta);
        
        // El núcleo brilla cuando responde
        document.getElementById('sphere').style.boxShadow = "0 0 60px #ffd700";
        setTimeout(() => { 
            document.getElementById('sphere').style.boxShadow = "0 0 30px rgba(255, 215, 0, 0.5)";
        }, 2000);
    };

    rec.onend = () => {
        // Reinicio automático para escucha continua (Always-on)
        rec.start();
    };
</script>
</body>
</html>
